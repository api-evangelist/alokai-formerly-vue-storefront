aid: alokai-formerly-vue-storefront
name: Alokai (formerly Vue Storefront)
description: >-
  Alokai (formerly Vue Storefront) is a Frontend-as-a-Service platform for
  composable, headless commerce. It connects enterprise ecommerce backends
  (SAP Commerce Cloud, Salesforce, Adobe Commerce/Magento, commercetools,
  BigCommerce, Shopware and others) to fast, customizable storefronts through
  the Alokai SDK, a server-side Middleware layer, a Unified Data Layer, the
  StorefrontUI component library, and Alokai Cloud hosting managed via the
  Alokai Console. The Alokai Cloud API ("farmer", OpenAPI 3.0) programmatically
  manages cloud instances, deployments, pods, ingresses, CDN cache and
  environment variables, authenticated with X-Api-Key and X-User-Id headers.
