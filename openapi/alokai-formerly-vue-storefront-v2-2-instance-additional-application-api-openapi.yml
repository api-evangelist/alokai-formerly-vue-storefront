openapi: 3.2.0
info:
  title: farmer V2.2/instance/additional Application API
  version: v1
tags:
- name: v2.2/instance/additional_application
paths:
  /v2.2/instance/{instance}/additional_application:
    post:
      parameters:
      - in: body
        name: body
        required: false
        schema:
          $ref: '#/components/schemas/AppV22'
      - in: path
        name: instance
        required: true
        type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppV22'
          description: Success
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppV22'
          description: Success
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppV22'
          description: Success
        '404':
          description: Additional application doesn't exist
        '500':
          description: Exception occurred
        default:
          description: ''
          schema:
            $ref: '#/components/schemas/AppV22'
      summary: Manage instance's additional applications
      tags:
      - v2.2/instance/additional_application
      operationId: postV22InstanceByInstanceAdditionalApplication
      x-operation-id-source: derived
  /v2.2/instance/{instance}/additional_application/{additional_application_name}:
    delete:
