      summary: Manage instance's additional applications
      tags:
      - v2.2/instance/additional_application
      operationId: deleteV22InstanceByInstanceAdditionalApplicationByAdditionalApplicationName
      x-operation-id-source: derived
    get:
      parameters:
      - in: path
        name: instance
        required: true
        type: string
      - in: path
        name: additional_application_name
        required: true
        type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppV22'
          description: Success
        '201':
          content:
