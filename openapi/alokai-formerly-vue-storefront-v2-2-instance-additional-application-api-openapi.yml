          description: Success
        '404':
          description: Additional application doesn't exist
        '500':
          description: Exception occurred
        default:
          description: ''
          schema:
            $ref: '#/components/schemas/AppV22'
      summary: Manage instance's additional applications
      tags:
      - v2.2/instance/additional_application
      operationId: getV22InstanceByInstanceAdditionalApplicationByAdditionalApplicationName
      x-operation-id-source: derived
    put:
      parameters:
      - in: body
        name: body
        required: false
        schema:
          $ref: '#/components/schemas/AppV22'
      - in: path
        name: instance
        required: true
        type: string
      - in: path
        name: additional_application_name
        required: true
        type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppV22'
          description: Success
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppV22'
          description: Success
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppV22'
          description: Success
        '404':
          description: Additional application doesn't exist
        '500':
          description: Exception occurred
        default:
          description: ''
